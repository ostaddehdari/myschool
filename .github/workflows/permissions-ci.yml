name: MySchool PHP lint and permission catalog
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint all PHP files
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke test permission catalog
        run: php tests/organization-permissions.php
